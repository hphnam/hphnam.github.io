<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">What is in the Basel climate dataset?</title><desc id="desc">Seven weather-variable families across 1,763 records and 18 raw columns. Lines show each selected variable’s observed minimum to maximum, with a red median marker. Every line uses its own scale.</desc><rect width="1200" height="670" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#172b48}.label{font-size:18px}.note{font-size:12px;fill:#6b7888}.value{font-size:14px}.head{font-size:12px;letter-spacing:1.3px;fill:#ad392c}</style><text x="30" y="35" class="head">BASEL / NUMERICAL WEATHER RECORDS</text><text x="30" y="80" font-size="36">1,763 days. 18 measurements per record.</text><text x="30" y="111" class="note">Observed ranges of seven selected variables · min — median — max · each row has its own scale</text><text x="460" y="155" class="note">MINIMUM</text><text x="775" y="155" class="note">MEDIAN</text><text x="1050" y="155" class="note">MAXIMUM</text><text x="30" y="195" class="label">Temperature</text><text x="240" y="195" class="note">Daily mean · °C</text><line x1="585" y1="190" x2="1015" y2="190" stroke="#c9d3df" stroke-width="4"/><circle cx="836.39" cy="190" r="6" fill="#ad392c"/><text x="460" y="195" class="value">-7.63</text><text x="1040" y="195" class="value">30.43</text><text x="836.39" y="213" text-anchor="middle" class="note">14.62</text><text x="30" y="260" class="label">Humidity</text><text x="240" y="260" class="note">Daily mean · %</text><line x1="585" y1="255" x2="1015" y2="255" stroke="#c9d3df" stroke-width="4"/><circle cx="839.35" cy="255" r="6" fill="#ad392c"/><text x="460" y="260" class="value">38.33</text><text x="1040" y="260" class="value">95.25</text><text x="839.35" y="278" text-anchor="middle" class="note">72.00</text><text x="30" y="325" class="label">Pressure</text><text x="240" y="325" class="note">Daily mean · hPa</text><line x1="585" y1="320" x2="1015" y2="320" stroke="#c9d3df" stroke-width="4"/><circle cx="826.19" cy="320" r="6" fill="#ad392c"/><text x="460" y="325" class="value">978.45</text><text x="1040" y="325" class="value">1,047.10</text><text x="826.19" y="343" text-anchor="middle" class="note">1,016.95</text><text x="30" y="390" class="label">Rainfall</text><text x="240" y="390" class="note">Daily total · mm</text><line x1="585" y1="385" x2="1015" y2="385" stroke="#c9d3df" stroke-width="4"/><circle cx="585.00" cy="385" r="6" fill="#ad392c"/><text x="460" y="390" class="value">0.00</text><text x="1040" y="390" class="value">37.40</text><text x="585.00" y="408" text-anchor="middle" class="note">0.00</text><text x="30" y="455" class="label">Snowfall</text><text x="240" y="455" class="note">Daily amount · cm</text><line x1="585" y1="450" x2="1015" y2="450" stroke="#c9d3df" stroke-width="4"/><circle cx="585.00" cy="450" r="6" fill="#ad392c"/><text x="460" y="455" class="value">0.00</text><text x="1040" y="455" class="value">13.86</text><text x="585.00" y="473" text-anchor="middle" class="note">0.00</text><text x="30" y="520" class="label">Sunshine</text><text x="240" y="520" class="note">Daily duration · min</text><line x1="585" y1="515" x2="1015" y2="515" stroke="#c9d3df" stroke-width="4"/><circle cx="758.27" cy="515" r="6" fill="#ad392c"/><text x="460" y="520" class="value">0.00</text><text x="1040" y="520" class="value">962.28</text><text x="758.27" y="538" text-anchor="middle" class="note">387.75</text><text x="30" y="585" class="label">Wind speed</text><text x="240" y="585" class="note">Daily mean · km/h</text><line x1="585" y1="580" x2="1015" y2="580" stroke="#c9d3df" stroke-width="4"/><circle cx="652.15" cy="580" r="6" fill="#ad392c"/><text x="460" y="585" class="value">1.50</text><text x="1040" y="585" class="value">36.36</text><text x="652.15" y="603" text-anchor="middle" class="note">6.94</text><text x="30" y="655" class="note">Source: summary statistics in the supplied exploratory-data-analysis notebook. These are dataset summaries, not one day’s readings.</text></svg>